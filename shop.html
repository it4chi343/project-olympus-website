<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Project Olympus shop placeholder — coming soon."
    />
    <title>Project Olympus | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand" aria-label="Project Olympus">
          <img src="project_(1)_upscaled.png" alt="Project Olympus logo" class="brand-mark-image" />
        </div>
        <nav class="top-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
        </nav>
      </div>
    </header>

    <main class="shop-page">
      <div class="container">
        <section class="shop-hero">
          <h1>Shop</h1>
          <p class="lead">Designed for heavy training and everyday wear.</p>
        </section>

        <section class="shop-grid" aria-label="Project Olympus products">
          <article class="shop-card">
            <a href="product-tee.html" class="shop-product-link" aria-label="View Heavyweight Tee details">
              <img
                src="Clothes_Images/3100123fde2c4f1db8bc1e0672cbbf91.webp"
                alt="Project Olympus heavyweight tee"
                class="shop-product-image"
              />
              <h3>Heavyweight Tee</h3>
              <p>Premium cotton, oversized fit.</p>
            </a>
            <div class="shop-meta">
              <strong>£25</strong>
              <a href="product-tee.html" class="btn btn-secondary">View product</a>
            </div>
          </article>

          <article class="shop-card">
            <a href="product-hoodie.html" class="shop-product-link" aria-label="View Training Hoodie details">
              <img
                src="Clothes_Images/hoodie front.webp"
                alt="Project Olympus training hoodie front"
                class="shop-product-image"
              />
              <h3>Training Hoodie</h3>
              <p>Heavyweight jumper for cold sessions.</p>
            </a>
            <div class="shop-meta">
              <strong>£35</strong>
              <a href="product-hoodie.html" class="btn btn-secondary">View product</a>
            </div>
          </article>

        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Project Olympus</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
