<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Project Olympus shop placeholder — coming soon."
    />
    <title>Project Olympus | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">P</span>
          <span>Project Olympus</span>
        </div>
        <nav class="top-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
        </nav>
      </div>
    </header>

    <main class="shop-page">
      <div class="container">
        <section class="shop-hero">
          <p class="eyebrow">Project Olympus</p>
          <h1>Shop</h1>
          <p class="lead">Placeholder storefront coming soon.</p>
        </section>

        <section class="shop-grid" aria-label="Shop placeholder products">
          <article class="shop-card">
            <div class="shop-product-art">Drop 01</div>
            <h3>Heavyweight Tee</h3>
            <p>Coming soon</p>
            <div class="shop-meta">
              <strong>£38</strong>
              <a href="index.html#contact" class="btn btn-secondary">Notify me</a>

          <article class="shop-card">
            <div class="shop-product-art">Drop 02</div>
            <h3>Training Hoodie</h3>
            <p>Coming soon</p>
            <div class="shop-meta">
              <strong>£68</strong>
              <a href="index.html#contact" class="btn btn-secondary">Notify me</a>
            </div>
          </article>

          <article class="shop-card">
            <div class="shop-product-art">Drop 03</div>
            <h3>Performance Cap</h3>
            <p>Coming soon</p>
            <div class="shop-meta">
              <strong>£24</strong>
              <a href="index.html#contact" class="btn btn-secondary">Notify me</a>
            </div>
          </article>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Project Olympus</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
